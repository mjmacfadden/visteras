    <circle cx="5.6" cy="14.2" r="2.1" fill="none" stroke="#000000" stroke-width="1.4"/>
    <path d="M 6.7 16.0 C 6.8 17.8 6.3 19.2 5.0 20.4" fill="none" stroke="#000000" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
