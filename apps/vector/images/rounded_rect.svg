<!-- Visteras Rounded Rectangle tool icon: same frame, stroke and #CCCCCC glyph colour as the unified rect.svg (apps/studio/images/icons/rectangle.svg), with a larger corner radius. Studio has no Rounded Rectangle tool, so there is no Studio source to copy. -->
