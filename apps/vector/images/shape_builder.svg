<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none">
  <!-- Two overlapping circles representing mergeable regions -->
  <circle cx="9" cy="12" r="6" stroke="currentColor" stroke-width="1.5" fill="none"/>
  <circle cx="15" cy="12" r="6" stroke="currentColor" stroke-width="1.5" fill="none"/>
  <!-- Filled intersection region — the "combined" result -->
  <path d="M12 6.8A6 6 0 0 1 15 12a6 6 0 0 1-3 5.2A6 6 0 0 1 9 12a6 6 0 0 1 3-5.2z" fill="currentColor" opacity="0.4"/>
  <!-- Plus indicator -->
  <line x1="12" y1="10" x2="12" y2="14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="10" y1="12" x2="14" y2="12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
</svg>
