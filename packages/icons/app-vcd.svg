<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <filter id="appShadow" x="-20%" y="-15%" width="140%" height="135%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.32"/>
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a2c33"/>
      <stop offset="50%" stop-color="#1e2025"/>
      <stop offset="100%" stop-color="#141518"/>
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>
  </defs>

  <!-- App Squircle Base -->
  <g filter="url(#appShadow)">
    <rect x="36" y="36" width="440" height="440" rx="98" fill="url(#bgGrad)"/>
    <rect x="36" y="36" width="440" height="440" rx="98" fill="none" stroke="url(#borderGrad)" stroke-width="2"/>
  </g>

  <!-- App Logo Glyph -->
  <g filter="url(#logoGlow)" transform="translate(256, 225) scale(0.56) translate(-256, -256)">
    <path d="M 37.4,83.7 L 36.4,84.8 L 36.4,87.7 L 37.8,90.2 L 251.7,426.2 L 256.4,426.2 L 294.8,368.6 L 458.2,114.9 L 475.3,88.1 L 475.6,85.5 L 474.2,83.7 L 382.9,83.7 L 380.0,86.3 L 329.2,163.1 L 273.8,242.1 L 269.4,242.1 L 169.0,86.3 L 166.5,83.7 Z"
          fill="url(#brandGrad)"
          fill-rule="evenodd"/>
  </g>

  <!-- Extension Badge Tag at Bottom -->
  <rect x="176" y="382" width="160" height="44" rx="22" fill="url(#brandGrad)"/>
  <text x="256" y="406"
        font-family="system-ui, -apple-system, 'SF Pro Display', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="22"
        font-weight="800"
        letter-spacing="3"
        fill="#ffffff"
        text-anchor="middle"
        dominant-baseline="central">VCD</text>
</svg>